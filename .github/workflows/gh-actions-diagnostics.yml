name: GitHub Actions Diagnostics

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Archive Retention
      - Convert Images to WebP
      - Notification
      - STE Lint Changed Documentation
      - STE Lint Full Technical Documentation
      - Validate Document Standards
    types:
      - completed
    branches:
      - gpt
  push:
    branches:
      - gpt
    paths-ignore:
      - '.archive/reports/**'
      - '.takeout/reports/gh_ac_reports/history/**'
      - '.takeout/reports/gh_ac_reports/by_workflow/**'
      - '.takeout/reports/gh_ac_reports/index.json'
      - '.takeout/reports/gh_ac_reports/latest-gh-ac-report.*'
      - '.takeout/reports/gh_ac_reports/requests/processed/**'
      - '.takeout/reports/triage/ledger.json'
      - 'workspace/tasks/**'
      - 'workspace/task_board.md'
      - 'workspace/discussion.md'

concurrency:
  group: gh-ac-report-writer-${{ github.repository }}
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  sweep:
    name: Backfill completed workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile and test the diagnostic reporter
        run: |
          python3 -m py_compile .takeout/reports/gh_ac_reports/scripts/report.py .takeout/reports/triage/scripts/ledger.py .github/scripts/cleanup-archive.py
          python3 .github/scripts/test_cleanup_archive.py
          python3 -m unittest discover \
            -s .takeout/reports/gh_ac_reports/scripts \
            -p 'test_report.py' \
            -v
          python3 -m unittest discover \
            -s .takeout/reports/triage/scripts \
            -p 'test_ledger.py' \
            -v

      - name: Backfill completed runs and explicit requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .takeout/reports/gh_ac_reports/scripts/report.py --mode sweep --repo "$GITHUB_REPOSITORY"

      - name: Ingest centralized CI issues
        run: python3 .takeout/reports/triage/scripts/ledger.py --mode ingest

      - name: Publish diagnostic backfill and Worker tasks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .takeout/reports/gh_ac_reports/ .takeout/reports/triage/ workspace/tasks/ workspace/task_board.md
          if git diff --cached --quiet; then
            echo "No new diagnostic evidence to publish."
            exit 0
          fi
          git commit -m "Publish GitHub Actions diagnostics and CI issue ledger"
          for attempt in 1 2 3 4 5; do
            git fetch origin gpt
            if ! git rebase origin/gpt; then
              git rebase --abort || true
              echo "::error::Could not rebase diagnostic backfill onto gpt."
              exit 1
            fi
            if git push origin HEAD:refs/heads/gpt; then
              echo "Diagnostic backfill published."
              exit 0
            fi
            git fetch origin gpt
            if git merge-base --is-ancestor origin/gpt HEAD; then
              echo "::error::Push failed while origin/gpt was unchanged."
              exit 1
            fi
          done
          echo "::error::Could not publish diagnostic backfill after five attempts."
          exit 1
