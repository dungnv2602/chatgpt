name: GitHub Actions Diagnostics

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Scheduled Archive Individual Retention
      - Process Image Takeout and Create WebP Derivatives
      - STE Lint Changed Documentation
      - STE Lint Full Technical Documentation
      - Validate Document Standards
      - Send Email on Notification Tag
    types:
      - completed
  push:
    branches:
      - gpt
    paths-ignore:
      - 'workspace/archive/reports/**'
      - '.takeout/reports/history/**'
      - '.takeout/reports/index.json'
      - '.takeout/reports/requests/processed/**'
      - '.takeout/reports/ledger.json'
      - 'workspace/tasks/**'
      - 'workspace/task-validation/**'
      - 'workspace/task_board.md'
      - 'workspace/discussion.md'

concurrency:
  group: gh-ac-report-writer-${{ github.repository }}
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  policy_gate:
    name: Gate legacy diagnostics after coordinator activation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out trusted Worker policy
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 1
          persist-credentials: false

      - name: Gate only coordinator-owned workflow-run diagnostics
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          current_policy_json=$(cat .agent/skills/the-worker/assets/task-validation/task-validation-policy.json)
          policy_ready='
            .coordinator.activation_status == "enabled" and
            .protection.enforcement_status == "verified" and
            .recovery.workflow_dispatch_activation_status == "verified"
          '
          current_ready=false
          if jq -e "$policy_ready" <<< "$current_policy_json" >/dev/null 2>&1; then
            current_ready=true
          fi
          proceed=true
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            task_id_count=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | grep -Ec '^Task-ID: [0-9]{8}-[0-9]{6}(-[0-9]{2})*

  sweep:
    name: Backfill completed workflow runs
    needs: [policy_gate]
    if: needs.policy_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile and test the diagnostic reporter
        run: |
          python3 -m py_compile .agent/skills/the-worker/scripts/actions-report.py .agent/skills/the-worker/scripts/ledger.py .github/scripts/cleanup-archive.py
          python3 .github/scripts/test_cleanup_archive.py
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_actions-report.py' \
            -v
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_ledger.py' \
            -v

      - name: Backfill completed runs and explicit requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .agent/skills/the-worker/scripts/actions-report.py --mode sweep --repo "$GITHUB_REPOSITORY"

      - name: Ingest centralized CI issues
        run: python3 .agent/skills/the-worker/scripts/ledger.py --mode ingest

      - name: Publish diagnostic backfill and Worker tasks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .takeout/reports/ workspace/tasks/ workspace/task_board.md
          if git diff --cached --quiet; then
            echo "No new diagnostic evidence to publish."
            exit 0
          fi
          git commit -m "Publish GitHub Actions diagnostics and CI issue ledger"
          for attempt in 1 2 3 4 5; do
            git fetch origin gpt
            if ! git rebase origin/gpt; then
              git rebase --abort || true
              echo "::error::Could not rebase diagnostic backfill onto gpt."
              exit 1
            fi
            if git push origin HEAD:refs/heads/gpt; then
              echo "Diagnostic backfill published."
              exit 0
            fi
            git fetch origin gpt
            if git merge-base --is-ancestor origin/gpt HEAD; then
              echo "::error::Push failed while origin/gpt was unchanged."
              exit 1
            fi
          done
          echo "::error::Could not publish diagnostic backfill after five attempts."
          exit 1
 || true)
            source_policy_json=""
            if [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              source_policy_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.agent/skills/the-worker/assets/task-validation/task-validation-policy.json?ref=$HEAD_SHA" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
            fi
            if [[ "$task_id_count" == "1" && "$current_ready" == "true" && -n "$source_policy_json" ]] &&
               jq -e "$policy_ready" <<< "$source_policy_json" >/dev/null 2>&1; then
              proceed=false
            fi
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  sweep:
    name: Backfill completed workflow runs
    needs: [policy_gate]
    if: needs.policy_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile and test the diagnostic reporter
        run: |
          python3 -m py_compile .agent/skills/the-worker/scripts/actions-report.py .agent/skills/the-worker/scripts/ledger.py .github/scripts/cleanup-archive.py
          python3 .github/scripts/test_cleanup_archive.py
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_actions-report.py' \
            -v
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_ledger.py' \
            -v

      - name: Backfill completed runs and explicit requests
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .agent/skills/the-worker/scripts/actions-report.py --mode sweep --repo "$GITHUB_REPOSITORY"

      - name: Ingest centralized CI issues
        run: python3 .agent/skills/the-worker/scripts/ledger.py --mode ingest

      - name: Publish diagnostic backfill and Worker tasks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .takeout/reports/ workspace/tasks/ workspace/task_board.md
          if git diff --cached --quiet; then
            echo "No new diagnostic evidence to publish."
            exit 0
          fi
          git commit -m "Publish GitHub Actions diagnostics and CI issue ledger"
          for attempt in 1 2 3 4 5; do
            git fetch origin gpt
            if ! git rebase origin/gpt; then
              git rebase --abort || true
              echo "::error::Could not rebase diagnostic backfill onto gpt."
              exit 1
            fi
            if git push origin HEAD:refs/heads/gpt; then
              echo "Diagnostic backfill published."
              exit 0
            fi
            git fetch origin gpt
            if git merge-base --is-ancestor origin/gpt HEAD; then
              echo "::error::Push failed while origin/gpt was unchanged."
              exit 1
            fi
          done
          echo "::error::Could not publish diagnostic backfill after five attempts."
          exit 1
