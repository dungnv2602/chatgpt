name: Validate Document Standards

on:
  workflow_call:
    inputs:
      coordinator_call:
        description: "True when invoked by the ADR-0008 exact-SHA coordinator."
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Exact source commit to validate."
        required: true
        type: string
  push:
    branches:
      - gpt
    paths:
      # Check every skill-owned template, schema, and authoring rule.
      - '.agent/skills/**'
      # Include the root-level initialization policy and session-start contract.
      - '.agent/*.md'
      # Include the image takeout guides and their supporting assets.
      - '.takeout/images/**'
      # Validate changes to catalog authorities, generators, schemas, and tests.
      - '.github/scripts/**'
      - '.github/archive-retention-*.json'
      # Enforce catalog coverage whenever any active document family changes.
      # master/ and workspace/archive/ remain outside this inventory scan.
      - 'area/drawing/**/*.md'
      - 'area/novel/**/*.md'
      - '.takeout/reports/**/*.md'
      # Keep legacy Ledger regression coverage while the report migration is staged.
      - '.agent/skills/the-worker/scripts/ledger.py'
      - '.agent/skills/the-worker/scripts/test_ledger.py'
      - '.agent/skills/the-worker/assets/ledger-schema.json'
      # Exclude generator-owned output so report publication cannot retrigger this workflow.
      - 'workspace/**/*.md'
      - '!workspace/archive/**'
      - '!workspace/discussion.md'
      - '!workspace/tasks/**'
      - '!workspace/task_board.md'
      - '.github/**/*.md'
      - '*.md'
      # Check novel workspace contracts and indexes. Templates are skill-owned.
      - 'area/novel/README.md'
      - 'area/novel/WORKFLOW.md'
      - 'workspace/README.md'
      - '.github/workflows/**'
      # Validate every GitHub configuration path so unowned policy files fail closed.
      - '.github/**'
      # Govern all workspace non-Markdown artifacts; exclude operational/generated state from source validation.
      - 'workspace/**'
      - '!workspace/archive/**'
      - '!workspace/discussion.md'
      - '!workspace/tasks/**'
      - '!workspace/task_board.md'
      - '!workspace/task-validation/status-index.json'
      - '!workspace/task-validation/reviews/**'
  workflow_dispatch: {}

# A newer push to the same branch supersedes the older validation run.
# Commits on gpt are cumulative: the newest run checks the combined tree,
# including earlier commits. The diagnostics job still preserves any completed
# failure evidence from a superseded run before its own cancellation where possible.
# Supersede only older push validations for this branch. Manual runs are independent.
concurrency:
  group: document-standards-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  policy_gate:
    name: Gate legacy document-standards trigger after coordinator activation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out the exact source policy
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Select coordinator or legacy invocation
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATOR_CALL: ${{ inputs.coordinator_call }}
        run: |
          set -euo pipefail
          source_policy_json=$(cat .agent/skills/the-worker/assets/task-validation/task-validation-policy.json)
          current_policy_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.agent/skills/the-worker/assets/task-validation/task-validation-policy.json?ref=gpt" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
          policy_ready='
            .coordinator.activation_status == "enabled" and
            .protection.enforcement_status == "verified" and
            .recovery.workflow_dispatch_activation_status == "verified"
          '
          coordinator_ready=false
          if [[ -n "$current_policy_json" ]] &&
             jq -e "$policy_ready" <<< "$source_policy_json" >/dev/null 2>&1 &&
             jq -e "$policy_ready" <<< "$current_policy_json" >/dev/null 2>&1; then
            coordinator_ready=true
          fi
          proceed=true
          if [[ "$COORDINATOR_CALL" != "true" && "$GITHUB_EVENT_NAME" == "push" && "$coordinator_ready" == "true" ]]; then
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  validate-document-standards:
    needs: [policy_gate]
    if: github.ref == 'refs/heads/gpt' && needs.policy_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out gpt
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run CI Ledger regression tests
        run: python -m unittest discover -s .agent/skills/the-worker/scripts -p 'test_ledger.py' -v

      - name: Run catalog validator regression tests
        run: |
          python -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_validate_document_catalog.py' \
            -v

      - name: Run ADR-0008 verifier regression tests
        run: |
          python -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_task_validation.py' \
            -v
          python -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_aggregate_task_validation.py' \
            -v
          python -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_build_task_validation_contract.py' \
            -v
          python -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_publish_task_validation.py' \
            -v
          python -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_recover_task_validation.py' \
            -v

      - name: Run structural ownership validator tests
        run: python -m unittest discover -s .agent/skills/the-worker/scripts -p 'test_validate_structural_ownership.py' -v

      - name: Validate structural ownership
        run: python .agent/skills/the-worker/scripts/validate_structural_ownership.py --root .

      - name: Validate the document type catalog
        run: |
          python .agent/skills/the-worker/scripts/validate_document_catalog.py --root .

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() && inputs.coordinator_call != true && needs.policy_gate.outputs.proceed == 'true' }}
    needs: [policy_gate, validate-document-standards]
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./.takeout/reports/gh_ac_reports/actions/capture
        with:
          run_id: ${{ github.run_id }}
