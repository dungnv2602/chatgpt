name: STE Lint Full Technical Documentation

on:
  push:
    branches:
      - gpt
    paths:
      - 'skills/asd-ste100/**'
      - '.github/workflows/ste-lint-full-docs.yml'
      - '.github/workflows/ste-lint-changed.yml'
      - '!skills/asd-ste100/examples/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ste-lint:
    name: Lint all in-scope technical Markdown files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run linter self-test
        run: python3 skills/asd-ste100/scripts/ste-lint.py --selftest

      - name: Check active Markdown file links and heading anchors
        run: python3 skills/asd-ste100/scripts/check_markdown_anchors.py

      - name: Lint all in-scope technical Markdown files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' |
            grep -vE '^(novels/|drawings/|master/|skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))')
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if bash skills/asd-ste100/scripts/ste-lint-repository.sh "$file"; then
              :
            else
              echo "Lint failure: $file"
              failed=1
            fi
          done <<< "$files"
          exit "$failed"
