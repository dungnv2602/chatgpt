name: Process Image Takeout and Create WebP Derivatives

on:
  push:
    branches:
      - gpt
    paths:
      # Intake uploads trigger validation. Ready-state changes and processor,
      # test, or workflow edits require an explicit manual dispatch.
      - '.takeout/images/*'
      - '!.takeout/images/HANDOFF.yml'
      - '!.takeout/images/README.md'
      - '!.takeout/images/README.md'
      - '!.takeout/images/.gitkeep'
      - 'area/drawing/history/*-conversation-integrity.md'
      - 'area/novel/**/conversation-integrity.md'
      - '.takeout/images/**/conversation-integrity.md'
      # Maintenance changes do not launch a batch against the live intake.
  workflow_dispatch: {}

concurrency:
  group: image-takeout-${{ github.ref }}
  queue: max
  cancel-in-progress: false

permissions: {}

jobs:
  process-image-takeout:
    if: github.ref == 'refs/heads/gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out gpt
        uses: actions/checkout@v7.0.1
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Install WebP encoder and YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install --yes webp python3-yaml

      - name: Compile takeout processor and publication verifier
        run: |
          python3 -m py_compile \
            .agent/skills/the-worker/scripts/process_takeout.py \
            .agent/skills/the-worker/scripts/verify_published_manifest.py

      - name: Test takeout processor
        run: |
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_process_takeout_unittest.py' \
            -v

      - name: Process takeout hand-off
        id: process
        continue-on-error: true
        run: |
          python3 .agent/skills/the-worker/scripts/process_takeout.py \
            --repo-root . \
            --run-id "$GITHUB_RUN_ID"

      - name: Commit and safely publish processed assets and reports
        if: always() && steps.process.outcome != 'skipped'
        shell: bash
        env:
          PROCESS_OUTCOME: ${{ steps.process.outcome }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the relocated shared image store and project-specific outputs.
          for path in .takeout/images/ area/drawing/ area/novel/; do
            if [[ -d "$path" ]]; then
              git add -A -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No takeout processing changes to publish."
            exit 0
          fi

          if [[ "$PROCESS_OUTCOME" == "failure" ]]; then
            commit_message="chore(images): archive failed takeout diagnostics"
          else
            commit_message="chore(images): process takeout batch"
          fi
          git commit -m "$commit_message"

          # Never force-push. Rebase onto the latest gpt branch and retry
          # only if another writer advances the remote during publication.
          max_attempts=5
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Publish attempt $attempt/$max_attempts"
            git fetch origin gpt

            if ! git rebase origin/gpt; then
              git rebase --abort || true
              echo "::error::Could not rebase takeout changes cleanly. No remote changes were overwritten."
              exit 1
            fi

            if git push origin HEAD:refs/heads/gpt; then
              echo "Takeout results and reports published successfully."
              exit 0
            fi

            git fetch origin gpt
            if git merge-base --is-ancestor origin/gpt HEAD; then
              echo "::error::Push failed although origin/gpt did not advance. Check token permissions or branch protection."
              exit 1
            fi

            echo "Remote branch advanced during push; synchronizing and retrying."
          done

          echo "::error::Could not publish after $max_attempts synchronization attempts."
          exit 1

      - name: Verify published assets and GitHub links
        if: steps.process.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt

          # This verifies the first published commit and changes Pending
          # manifest rows only after the exact remote blobs and URLs match.
          python3 .agent/skills/the-worker/scripts/verify_published_manifest.py \
            --repo-root . \
            --git-ref origin/gpt \
            --branch gpt

          if ! git diff --quiet -- area/drawing/; then
            git add -A -- area/drawing/
            git commit -m "chore(drawings): verify published image manifests"

            max_attempts=5
            for attempt in $(seq 1 "$max_attempts"); do
              echo "Manifest verification publish attempt $attempt/$max_attempts"
              git fetch origin gpt

              if ! git rebase origin/gpt; then
                git rebase --abort || true
                echo "::error::Could not rebase manifest verification onto the latest gpt branch."
                exit 1
              fi

              if git push origin HEAD:refs/heads/gpt; then
                break
              fi

              git fetch origin gpt
              if git merge-base --is-ancestor origin/gpt HEAD; then
                echo "::error::Could not publish verified manifest; origin/gpt did not advance."
                exit 1
              fi
              if [[ "$attempt" == "$max_attempts" ]]; then
                echo "::error::Could not publish verified manifest after $max_attempts attempts."
                exit 1
              fi
            done
          fi

          git fetch origin gpt
          python3 .agent/skills/the-worker/scripts/verify_published_manifest.py \
            --repo-root . \
            --git-ref origin/gpt \
            --branch gpt \
            --check-only

      - name: Mark processing failures
        if: steps.process.outcome == 'failure'
        run: |
          echo "::error::Takeout processing failed. The hand-off remains active; inspect the archived diagnostic report."
          exit 1

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() }}
    needs: [process-image-takeout]
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./.takeout/reports/gh_ac_reports/actions/capture
