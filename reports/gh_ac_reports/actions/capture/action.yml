name: Capture GitHub Actions diagnostics
description: Validate the diagnostic tools, capture the calling workflow, and publish the report.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Compile and test the diagnostic reporter
      continue-on-error: true
      shell: bash
      run: |
        python3 -m py_compile reports/gh_ac_reports/scripts/report.py
        python3 -m unittest discover \
          -s gh_ac_reports/scripts \
          -p 'test_report.py' \
          -v

    - name: Capture source workflow jobs and steps
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python3 reports/gh_ac_reports/scripts/report.py \
          --mode current \
          --repo "$GITHUB_REPOSITORY" \
          --run-id "$GITHUB_RUN_ID"

    - name: Publish immutable diagnostic evidence
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A -- reports/gh_ac_reports/
        if git diff --cached --quiet; then
          echo "No new diagnostic evidence to publish."
          exit 0
        fi
        git commit -m "Publish GitHub Actions diagnostics"
        for attempt in 1 2 3 4 5; do
          git fetch origin gpt
          if ! git rebase origin/gpt; then
            git rebase --abort || true
            echo "::error::Could not rebase diagnostic evidence onto gpt."
            exit 1
          fi
          if git push origin HEAD:refs/heads/gpt; then
            echo "Diagnostic evidence published."
            exit 0
          fi
          git fetch origin gpt
          if git merge-base --is-ancestor origin/gpt HEAD; then
            echo "::error::Push failed while origin/gpt was unchanged."
            exit 1
          fi
        done
        echo "::error::Could not publish diagnostic evidence after five attempts."
        exit 1
