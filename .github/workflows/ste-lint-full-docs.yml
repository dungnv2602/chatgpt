name: STE Lint Full Technical Documentation

on:
  push:
    branches:
      - gpt
    paths:
      - 'skills/asd-ste100/**'
      - '.github/workflows/ste-lint-full-docs.yml'
      - '.github/workflows/ste-lint-changed.yml'
      - '!skills/asd-ste100/examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate target branch and reject superseded push runs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Validate branch and guard push runs
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "gpt" ]]; then
            echo "::error::Select the gpt branch when manually dispatching this workflow."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Manual run on gpt. Continue."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! latest_run=$(gh run list \
            --workflow ".github/workflows/ste-lint-full-docs.yml" \
            --branch "$GITHUB_REF_NAME" \
            --event push \
            --limit 100 \
            --json databaseId,number \
            --jq 'max_by(.number).databaseId // empty' 2>/dev/null); then
            latest_run=""
          fi

          if [[ -n "$latest_run" && "$latest_run" != "$GITHUB_RUN_ID" ]]; then
            echo "A newer push run ($latest_run) supersedes this run ($GITHUB_RUN_ID)."
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null
            exit 0
          fi

          if [[ -z "$latest_run" ]]; then
            echo "::warning::Could not identify the latest push run. Continue with validation."
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  ste-lint:
    name: Full audit and update consolidated report
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate report tooling
        shell: bash
        run: |
          set -euo pipefail
          bash -n skills/asd-ste100/scripts/ste-lint-repository.sh
          python3 -m py_compile skills/asd-ste100/scripts/generate_lint_report.py
          python3 skills/asd-ste100/scripts/test_generate_lint_report.py

      - name: Run full audit and generate report
        id: audit
        shell: bash
        run: |
          set -uo pipefail
          report="lint_reports/latest-lint-report.md"
          mkdir -p lint_reports
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          overall_failed=0
          total_findings=0
          files_scanned=0
          files_with_findings=0
          lint_failed_files=0

          {
            echo "# Latest Repository-wide Lint Report"
            echo
            echo "- **Run:** [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- **Date (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** [${GITHUB_SHA}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- **Trigger:** ${GITHUB_EVENT_NAME}"
            echo
            echo "This report is replaced by the next complete run. The generated report is excluded from subsequent lint source scans."
            echo
            echo "## Summary"
            echo
          } > "$report"

          run_check() {
            local title="$1"
            shift
            local output="$tmpdir/check-$RANDOM.txt"
            local status=0
            "$@" > "$output" 2>&1 || status=$?
            if [[ "$status" -ne 0 ]]; then overall_failed=1; fi
            {
              echo "### $title"
              echo
              if [[ "$status" -eq 0 ]]; then
                echo "**Status:** PASS"
              else
                echo "**Status:** FAIL (exit $status)"
              fi
              echo
              echo '~~~text'
              cat "$output"
              echo '~~~'
              echo
            } >> "$report"
          }

          run_check "Linter self-test" python3 skills/asd-ste100/scripts/ste-lint.py --selftest
          run_check "Markdown links and heading anchors" python3 skills/asd-ste100/scripts/check_markdown_anchors.py

          mapfile -t files < <(
            git ls-files '*.md' |
              grep -vE '^(archive/|lint_reports/|workspace/tasks/|workspace/discussion\.md$|novels/|drawings/|master/|skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))' || true
          )

          findings_file="$tmpdir/findings.md"
          : > "$findings_file"

          for file in "${files[@]}"; do
            [[ -z "$file" ]] && continue
            files_scanned=$((files_scanned + 1))
            output="$tmpdir/file-lint.txt"
            status=0
            bash skills/asd-ste100/scripts/ste-lint-repository.sh "$file" > "$output" 2>&1 || status=$?

            summary=$(grep -E '^[0-9]+ violations \(' "$output" | tail -n 1 || true)
            count=$(printf '%s\n' "$summary" | sed -nE 's/^([0-9]+) violations.*/\1/p')
            hard=$(printf '%s\n' "$summary" | sed -nE 's/.*\(([0-9]+) hard,.*/\1/p')
            count=${count:-0}
            hard=${hard:-0}
            total_findings=$((total_findings + count))

            if [[ "$count" -gt 0 ]]; then
              files_with_findings=$((files_with_findings + 1))
              {
                printf '#### `%s`\n' "$file"
                echo
                echo '~~~text'
                cat "$output"
                echo '~~~'
                echo
              } >> "$findings_file"
            fi

            if [[ "$status" -ne 0 ]]; then
              lint_failed_files=$((lint_failed_files + 1))
              overall_failed=1
              if [[ "$count" -eq 0 ]]; then
                {
                  printf '#### `%s` (execution error, exit %s)\n' "$file" "$status"
                  echo
                  echo '~~~text'
                  cat "$output"
                  echo '~~~'
                  echo
                } >> "$findings_file"
              fi
            fi
          done

          {
            echo "- **Technical Markdown files scanned:** $files_scanned"
            echo "- **Files with findings:** $files_with_findings"
            echo "- **Total STE findings (hard and advisory):** $total_findings"
            echo "- **Files failing the configured hard-finding threshold or execution:** $lint_failed_files"
            if [[ "$overall_failed" -eq 0 ]]; then
              echo "- **Overall result:** PASS"
            else
              echo "- **Overall result:** FAIL"
            fi
            echo
            echo "## Exact Files Evaluated"
            echo
            for file in "${files[@]}"; do printf -- "- `%s`\n" "$file"; done
            echo
            echo "## STE-100 Findings by File"
            echo
            if [[ -s "$findings_file" ]]; then
              cat "$findings_file"
            else
              echo "No STE findings."
              echo
            fi
          } >> "$report"

          echo "overall_failed=$overall_failed" >> "$GITHUB_OUTPUT"
          echo "files_scanned=$files_scanned" >> "$GITHUB_OUTPUT"
          echo "files_with_findings=$files_with_findings" >> "$GITHUB_OUTPUT"
          echo "total_findings=$total_findings" >> "$GITHUB_OUTPUT"
          echo "lint_failed_files=$lint_failed_files" >> "$GITHUB_OUTPUT"

      - name: Commit the latest report to gpt
        if: ${{ !cancelled() && steps.audit.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lint_reports/latest-lint-report.md
          if git diff --cached --quiet; then
            echo "The report has no changes."
            exit 0
          fi
          git commit -m "Update latest repository-wide lint report"
          git push origin "HEAD:gpt"

      - name: Publish immutable repository-wide evidence history
        if: always() && steps.audit.outcome != 'skipped'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_FAILED: ${{ steps.audit.outputs.overall_failed }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          scope="lint_reports/on_repo"
          history="$scope/history/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$history"
          cp lint_reports/latest-lint-report.md "$history/report.md"
          python3 - "$history/report.json" <<'PY'
          import hashlib, json, os, re, sys
          from datetime import datetime, timezone
          report_path = "lint_reports/latest-lint-report.md"
          with open(report_path, encoding="utf-8") as stream:
              markdown = stream.read()
          coverage = markdown.split("## Exact Files Evaluated\n", 1)[-1].split("\n## ", 1)[0]
          files_evaluated = [line[3:-1] for line in coverage.splitlines() if line.startswith("- `") and line.endswith("`")]
          findings = []
          for line in markdown.splitlines():
              match = re.match(r"^(.+?):(\d+):(\d+) ([a-z0-9-]+): (.*?) \[(.*)\]$", line)
              if match:
                  file_path, line_number, column, rule, message, matched_text = match.groups()
                  fingerprint = hashlib.sha256(json.dumps([file_path, rule, matched_text, message], sort_keys=True).encode()).hexdigest()[:20]
                  findings.append({"file": file_path, "line": int(line_number), "column": int(column), "rule": rule, "message": message, "match": matched_text, "fingerprint": fingerprint})
          findings_by_rule = {}
          for finding in findings:
              findings_by_rule[finding["rule"]] = findings_by_rule.get(finding["rule"], 0) + 1
          data = {
              "schema_version": "1.0.0",
              "scope": "on_repo",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "status": "Failed" if os.environ.get("AUDIT_FAILED") == "1" or os.environ.get("AUDIT_OUTCOME") != "success" else "Passed",
              "execution_mode": "repository-wide",
              "files_evaluated": files_evaluated,
              "files_evaluated_count": len(files_evaluated),
              "findings": findings,
              "total_findings": len(findings),
              "findings_by_rule": findings_by_rule,
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "report_markdown": markdown
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(data, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY
          cp "$history/report.md" "$scope/latest-lint-report.md"
          cp "$history/report.json" "$scope/latest-lint-report.json"
          python3 - "$scope/index.json" "$history/report.json" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  index = json.load(stream)
          except FileNotFoundError:
              index = {"schema_version": "1.0.0", "runs": []}
          with open(sys.argv[2], encoding="utf-8") as stream:
              report = json.load(stream)
          index["runs"] = [row for row in index["runs"] if (row.get("run_id"), row.get("attempt", 1)) != (report["run_id"], report["attempt"])]
          index["runs"].append({key: report[key] for key in ("run_id", "run_number", "run_url", "attempt", "commit_sha", "generated_at_utc", "status")})
          index["runs"].sort(key=lambda row: (row["generated_at_utc"], row["run_id"]))
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(index, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$scope"
          if ! git diff --cached --quiet; then
            git commit -m "Publish repository-wide lint evidence history"
            git pull --rebase origin gpt
            git push origin "HEAD:gpt"
          fi

      - name: Set workflow result from audit findings
        if: always() && steps.audit.outcome != 'skipped'
        shell: bash
        run: |
          if [[ "${{ steps.audit.outputs.overall_failed }}" == "1" ]]; then
            echo "::error::The full audit found lint failures. See lint_reports/latest-lint-report.md."
            exit 1
          fi
          echo "All full-audit checks passed."
