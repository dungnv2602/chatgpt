name: Validate Document Standards

on:
  push:
    branches:
      - gpt
    paths:
      # Check every skill-owned template, schema, and authoring rule.
      - 'skills/**'
      # Enforce catalog coverage whenever any active document family changes.
      # master/ and archive/ remain outside this inventory scan.
      - 'drawings/**/*.md'
      - 'images/**/*.md'
      - 'novels/**/*.md'
      - 'reports/**/*.md'
      # Run Ledger regression tests when its implementation or schema changes.
      - 'reports/triage/scripts/**'
      - 'reports/triage/ledger-schema.json'
      # Exclude generator-owned output so report publication cannot retrigger this workflow.
      - '!reports/gh_ac_reports/history/**'
      - '!reports/gh_ac_reports/by_workflow/**'
      - '!reports/gh_ac_reports/latest-gh-ac-report.md'
      - '!reports/lint_reports/latest-lint-report.md'
      - '!reports/lint_reports/on_*/history/**'
      - '!reports/lint_reports/on_*/latest-lint-report.md'
      # Image conversion reports are generated output, not authored documents.
      - '!images/takeout/history/**'
      - 'workspace/**/*.md'
      - '!workspace/discussion.md'
      - '!workspace/tasks/**'
      - '!workspace/task_board.md'
      - '.github/**/*.md'
      - '*.md'
      # Check project-level and shared workspace templates and their owner contracts.
      - 'novels/templates/**'
      - 'novels/README.md'
      - 'novels/WORKFLOW.md'
      - 'workspace/TASK_TEMPLATE.md'
      - 'workspace/README.md'
      - '.github/workflows/**'
  workflow_dispatch: {}

concurrency:
  group: document-standards-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-document-standards:
    if: github.ref == 'refs/heads/gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out gpt
        uses: actions/checkout@v7.0.1
        with:
          ref: gpt
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run CI Ledger regression tests
        run: python -m unittest discover -s reports/triage/scripts -p 'test_ledger.py' -v

      - name: Run catalog validator regression tests
        run: |
          python -m unittest discover \
            -s skills/document-standards/scripts \
            -p 'test_validate_catalog.py' \
            -v

      - name: Validate the document type catalog
        run: |
          python skills/document-standards/scripts/validate_catalog.py --root .

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() }}
    needs: [validate-document-standards]
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./reports/gh_ac_reports/actions/capture
