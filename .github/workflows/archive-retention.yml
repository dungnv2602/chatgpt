name: Scheduled Archive Individual Retention

on:
  # Check the shared small retention index weekly. The cleanup script never lists archive directories.
  schedule:
    - cron: "0 0 * * 1"

concurrency:
  group: archive-retention
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete individually expired task and report files on gpt and fast-forward main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0

      - name: Verify branch ancestry
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/gpt:refs/remotes/origin/gpt
          git checkout --force -B gpt origin/gpt

          # Never overwrite an independently advanced or divergent main.
          if ! git merge-base --is-ancestor origin/main origin/gpt; then
            echo "::error::main is not an ancestor of gpt. Refusing to update either branch."
            exit 1
          fi

      - name: Run self-tests and delete individually expired indexed files
        id: cleanup
        run: python3 .github/scripts/cleanup-archive.py

      - name: Commit and synchronize branches
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No indexed records are due. No commit was created."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(archive): expire individually retained files past 90 days"

          # Update both refs to the same commit atomically. This is a
          # fast-forward of main to gpt; no merge commit or force push.
          git push --atomic origin HEAD:refs/heads/gpt HEAD:refs/heads/main

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() }}
    needs: [cleanup]
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./reports/gh_ac_reports/actions/capture
