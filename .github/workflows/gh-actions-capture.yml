name: Capture GitHub Actions Diagnostics

on:
  workflow_run:
    workflows:
      - Scheduled Archive Individual Retention
      - Process Image Takeout and Create WebP Derivatives
      - STE Lint Changed Documentation
      - STE Lint Full Technical Documentation
      - Validate Document Standards
      - Send Email on Notification Tag
    types:
      - completed

concurrency:
  group: gh-ac-capture-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  policy_gate:
    name: Gate legacy capture for coordinator-validated commits
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out trusted Worker policy
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 1
          persist-credentials: false

      - name: Select legacy capture mode
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_policy_json=$(cat .agent/skills/the-worker/assets/task-validation/task-validation-policy.json)
          source_policy_json=""
          if [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            source_policy_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.agent/skills/the-worker/assets/task-validation/task-validation-policy.json?ref=$HEAD_SHA" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
          fi
          policy_ready='
            .coordinator.activation_status == "enabled" and
            .protection.enforcement_status == "verified" and
            .recovery.schedule_activation_status == "verified" and
            .recovery.workflow_dispatch_activation_status == "verified"
          '
          proceed=true
          if [[ -n "$source_policy_json" ]] &&
             jq -e "$policy_ready" <<< "$current_policy_json" >/dev/null 2>&1 &&
             jq -e "$policy_ready" <<< "$source_policy_json" >/dev/null 2>&1; then
            proceed=false
          fi
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  capture:
    name: Capture completed workflow diagnostics
    needs: [policy_gate]
    if: needs.policy_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture source workflow diagnostics and reconcile the legacy Ledger
        uses: ./.takeout/reports/gh_ac_reports/actions/capture
        with:
          run_id: ${{ github.event.workflow_run.id }}
