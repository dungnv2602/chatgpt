name: STE Lint Full Technical Documentation

on:
  push:
    branches:
      - gpt
    paths:
      - 'skills/asd-ste100/**'
      - '.github/workflows/ste-lint-full-docs.yml'
      - '.github/workflows/ste-lint-changed.yml'
      - '!skills/asd-ste100/examples/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate target branch and reject superseded push runs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Validate branch and guard push runs
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "gpt" ]]; then
            echo "::error::Select the gpt branch when manually dispatching this workflow."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "Manual run on gpt. Continue."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! latest_run=$(gh run list \
            --workflow ".github/workflows/ste-lint-full-docs.yml" \
            --branch "$GITHUB_REF_NAME" \
            --event push \
            --limit 100 \
            --json databaseId,number \
            --jq 'max_by(.number).databaseId // empty' 2>/dev/null); then
            latest_run=""
          fi
          if [[ -n "$latest_run" && "$latest_run" != "$GITHUB_RUN_ID" ]]; then
            echo "A newer push run ($latest_run) supersedes this run ($GITHUB_RUN_ID)."
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null
            exit 0
          fi
          if [[ -z "$latest_run" ]]; then
            echo "::warning::Could not identify the latest push run. Continue with validation."
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  ste-lint:
    name: Full audit and publish detailed evidence
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate lint and report tooling
        id: tooling
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .lint-report-records
          failed=0
          run_check() {
            name="$1"
            shift
            output=".lint-report-records/$name.log"
            status=0
            "$@" > "$output" 2>&1 || status=$?
            key="$name"_exit
            printf '%s=%s\n' "$key" "$status" >> "$GITHUB_OUTPUT"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          }
          run_check wrapper_syntax bash -n skills/asd-ste100/scripts/ste-lint-repository.sh
          run_check python_compile python3 -m py_compile \
            skills/asd-ste100/scripts/generate_lint_report.py \
            skills/asd-ste100/scripts/check_markdown_anchors.py
          run_check report_tests python3 skills/asd-ste100/scripts/test_generate_lint_report.py
          run_check anchor_tests python3 skills/asd-ste100/scripts/test_check_markdown_anchors.py
          run_check linter_selftest python3 skills/asd-ste100/scripts/ste-lint.py --selftest
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Run full repository-wide audit and generate structured reports
        id: audit
        shell: bash
        env:
          TOOLING_FAILED: ${{ steps.tooling.outputs.failed }}
          WRAPPER_EXIT: ${{ steps.tooling.outputs.wrapper_syntax_exit }}
          PYTHON_EXIT: ${{ steps.tooling.outputs.python_compile_exit }}
          REPORT_TEST_EXIT: ${{ steps.tooling.outputs.report_tests_exit }}
          ANCHOR_TEST_EXIT: ${{ steps.tooling.outputs.anchor_tests_exit }}
          SELFTEST_EXIT: ${{ steps.tooling.outputs.linter_selftest_exit }}
        run: |
          set -euo pipefail
          mkdir -p .lint-report-records reports/reports/lint_reports/on_repo/history
          anchor_status=0
          python3 skills/asd-ste100/scripts/check_markdown_anchors.py \
            > .lint-report-records/anchor-check.log 2>&1 || anchor_status=$?

          git ls-files -- '*.md' |
            grep -vE '^(archive/|reports/|workspace/tasks/|workspace/discussion[.]md$|novels/|drawings/|master/|skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))' \
            > .lint-report-records/evaluated-files.txt || true

          failed=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            key=$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)
            output=".lint-report-records/$key.json"
            raw="$output.raw"
            status=0
            bash skills/asd-ste100/scripts/ste-lint-repository.sh --json "$file" > "$raw" 2>&1 || status=$?
            if jq -e '.violations | type == "array"' "$raw" >/dev/null 2>&1; then
              jq --arg path "$file" --argjson exit_code "$status" \
                '. + {path:$path, exit_code:$exit_code}' "$raw" > "$output"
            else
              python3 - "$file" "$status" "$raw" "$output" <<'PY'
          import json, pathlib, sys
          path, exit_code, raw_path, output_path = sys.argv[1:]
          raw = pathlib.Path(raw_path).read_text(encoding="utf-8", errors="replace")
          payload = {
              "path": path,
              "exit_code": int(exit_code) if int(exit_code) else 2,
              "capture_error": raw,
              "violations": [],
          }
          pathlib.Path(output_path).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
              failed=1
            fi
            rm -f "$raw"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          done < .lint-report-records/evaluated-files.txt

          TOOLING_FAILED="$TOOLING_FAILED" \
          WRAPPER_EXIT="$WRAPPER_EXIT" \
          PYTHON_EXIT="$PYTHON_EXIT" \
          REPORT_TEST_EXIT="$REPORT_TEST_EXIT" \
          ANCHOR_TEST_EXIT="$ANCHOR_TEST_EXIT" \
          SELFTEST_EXIT="$SELFTEST_EXIT" \
          ANCHOR_STATUS="$anchor_status" python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(".lint-report-records")
          checks = []
          for key, label in (
              ("WRAPPER_EXIT", "Wrapper shell syntax"),
              ("PYTHON_EXIT", "Python report tooling compilation"),
              ("REPORT_TEST_EXIT", "Lint report regression tests"),
              ("ANCHOR_TEST_EXIT", "Markdown anchor regression tests"),
              ("SELFTEST_EXIT", "STE linter self-test"),
          ):
              raw = os.environ.get(key, "")
              code = int(raw) if raw.isdigit() else 2
              log_names = {
                  "WRAPPER_EXIT": "wrapper_syntax.log",
                  "PYTHON_EXIT": "python_compile.log",
                  "REPORT_TEST_EXIT": "report_tests.log",
                  "ANCHOR_TEST_EXIT": "anchor_tests.log",
                  "SELFTEST_EXIT": "linter_selftest.log",
              }
              log = root / log_names[key]
              checks.append({
                  "name": label,
                  "status": "Passed" if code == 0 else "Failed",
                  "exit_code": code,
                  "output": log.read_text(encoding="utf-8", errors="replace") if log.exists() else "No output captured.",
              })
          anchor_code = int(os.environ.get("ANCHOR_STATUS", "2"))
          anchor_log = root / "anchor-check.log"
          checks.append({
              "name": "Markdown links and heading anchors",
              "status": "Passed" if anchor_code == 0 else "Failed",
              "exit_code": anchor_code,
              "output": anchor_log.read_text(encoding="utf-8", errors="replace") if anchor_log.exists() else "No output captured.",
          })
          pathlib.Path(".lint-report-checks.json").write_text(
              json.dumps(checks, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          if [[ "$failed" -ne 0 || "$anchor_status" -ne 0 || "$TOOLING_FAILED" == "1" ]]; then
            report_status="Failed"
            failed=1
          else
            report_status="Passed"
          fi
          history="reports/reports/lint_reports/on_repo/history/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          generator_status=0
          python3 skills/asd-ste100/scripts/generate_lint_report.py \
            --scope on_repo --records-dir .lint-report-records \
            --output-dir "$history" \
            --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" \
            --mode repository-wide --status "$report_status" \
            --checks-file .lint-report-checks.json \
            --previous-report reports/reports/lint_reports/on_repo/latest-lint-report.json \
            --linter-source-sha "$(git rev-parse HEAD)" || generator_status=$?
          if [[ "$generator_status" -ne 0 ]]; then
            echo "::error::The shared lint report generator failed with exit $generator_status."
            failed=1
          else
            cp reports/reports/lint_reports/on_repo/latest-lint-report.md reports/reports/lint_reports/latest-lint-report.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lint_reports/on_repo reports/reports/lint_reports/latest-lint-report.md
            if ! git diff --cached --quiet; then
              git commit -m "Publish repository-wide lint evidence"
              git pull --rebase origin gpt
              git push origin "HEAD:gpt"
            fi
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Set workflow result from audit and tooling outcomes
        if: always() && steps.audit.outcome != 'skipped'
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          AUDIT_FAILED: ${{ steps.audit.outputs.failed }}
          TOOLING_FAILED: ${{ steps.tooling.outputs.failed }}
        run: |
          if [[ "$AUDIT_OUTCOME" != "success" || "$AUDIT_FAILED" == "1" || "$TOOLING_FAILED" == "1" ]]; then
            echo "::error::The full audit found lint or validation failures. See reports/reports/lint_reports/on_repo/latest-lint-report.md."
            exit 1
          fi
          echo "All full-audit checks passed."

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() }}
    needs: [preflight, ste-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./gh_ac_reports/actions/capture
