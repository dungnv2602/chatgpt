name: Validate Document Standards

on:
  push:
    branches:
      - gpt
    paths:
      # Check every skill-owned template, schema, and authoring rule.
      - 'skills/**'
      # Check project-level and shared workspace templates and their owner contracts.
      - 'novels/templates/**'
      - 'novels/README.md'
      - 'novels/WORKFLOW.md'
      - 'workspace/TASK_TEMPLATE.md'
      - 'workspace/README.md'
      - '.github/workflows/validate-document-standards.yml'
  workflow_dispatch: {}

concurrency:
  group: document-standards-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-document-standards:
    if: github.ref == 'refs/heads/gpt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out gpt
        uses: actions/checkout@v7.0.1
        with:
          ref: gpt
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run catalog validator regression tests
        run: |
          python -m unittest discover \
            -s skills/document-standards/scripts \
            -p 'test_validate_catalog.py' \
            -v

      - name: Validate the document type catalog
        run: |
          python skills/document-standards/scripts/validate_catalog.py --root .

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() }}
    needs: [validate-document-standards]
    uses: ./.github/workflows/gh-actions-diagnostics.yml
    with:
      capture_mode: finalizer
    permissions:
      actions: read
      checks: read
      contents: write
