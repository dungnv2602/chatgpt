name: Capture GitHub Actions Diagnostics

on:
  workflow_run:
    workflows:
      - Scheduled Archive Individual Retention
      - Process Image Takeout and Create WebP Derivatives
      - STE Lint Changed Documentation
      - STE Lint Full Technical Documentation
      - Validate Document Standards
      - Send Email on Notification Tag
    types:
      - completed

concurrency:
  group: gh-ac-capture-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  policy_gate:
    name: Gate legacy capture after coordinator activation
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
    steps:
      - name: Check out trusted Worker policy
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 1
          persist-credentials: false

      - name: Select legacy capture mode
        id: gate
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path(".agent/skills/the-worker/assets/task-validation/task-validation-policy.json").read_text(encoding="utf-8"))
          proceed = policy.get("coordinator", {}).get("activation_status") != "enabled"
          print("proceed=" + ("true" if proceed else "false"))
          PY

  capture:
    name: Capture completed workflow diagnostics
    needs: [policy_gate]
    if: needs.policy_gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture source workflow diagnostics and reconcile the legacy Ledger
        uses: ./.takeout/reports/gh_ac_reports/actions/capture
        with:
          run_id: ${{ github.event.workflow_run.id }}
