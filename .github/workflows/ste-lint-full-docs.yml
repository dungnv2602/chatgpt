name: STE Lint Full Technical Documentation

on:
  push:
    branches:
      - gpt
    paths:
      - 'skills/asd-ste100/**'
      - '.github/workflows/ste-lint-full-docs.yml'
      - '.github/workflows/ste-lint-changed.yml'
      - '!skills/asd-ste100/examples/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Reject superseded runs before checkout
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - name: Cancel superseded run before checkout
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! latest_run=$(gh run list \
            --workflow ".github/workflows/ste-lint-full-docs.yml" \
            --branch "$GITHUB_REF_NAME" \
            --event push \
            --limit 100 \
            --json databaseId,number \
            --jq 'max_by(.number).databaseId // empty' 2>/dev/null); then
            latest_run=""
          fi

          if [[ -n "$latest_run" && "$latest_run" != "$GITHUB_RUN_ID" ]]; then
            echo "A newer run ($latest_run) supersedes this run ($GITHUB_RUN_ID)."
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel" >/dev/null
            exit 0
          fi

          if [[ -z "$latest_run" ]]; then
            echo "::warning::Could not identify the latest run. Continue with validation."
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  ste-lint:
    name: Lint all in-scope technical Markdown files
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run linter self-test
        run: python3 skills/asd-ste100/scripts/ste-lint.py --selftest

      - name: Check active Markdown file links and heading anchors
        run: python3 skills/asd-ste100/scripts/check_markdown_anchors.py

      - name: Lint all in-scope technical Markdown files
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' |
            grep -vE '^(novels/|drawings/|master/|skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))')
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if bash skills/asd-ste100/scripts/ste-lint-repository.sh "$file"; then
              :
            else
              echo "Lint failure: $file"
              failed=1
            fi
          done <<< "$files"
          exit "$failed"
