name: STE Lint Changed Documentation

on:
  push:
    branches:
      - gpt
    paths:
      - '**.md'
      - '!novels/**'
      - '!drawings/**'
      - '!master/**'
      - '!skills/romantic-storyteller-visual-artist/**'
      - '!skills/prompt-master/**'
      - '!skills/asd-ste100/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ste-lint:
    name: Lint changed Markdown files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run linter self-test
        run: python3 skills/asd-ste100/scripts/ste-lint.py --selftest

      - name: Find the last successful lint commit
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          last_success=$(gh run list \
            --workflow .github/workflows/ste-lint-changed.yml \
            --branch "$GITHUB_REF_NAME" \
            --event push \
            --status completed \
            --limit 100 \
            --json conclusion,headSha \
            --jq '[.[] | select(.conclusion == "success")][0].headSha // empty' || true)

          if [[ -z "$last_success" ]] ||
             ! git cat-file -e "${last_success}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$last_success" "$GITHUB_SHA"; then
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "base_sha=$last_success" >> "$GITHUB_OUTPUT"
          echo "full_audit=false" >> "$GITHUB_OUTPUT"

      - name: Check active Markdown file links and heading anchors
        if: steps.baseline.outputs.full_audit == 'true'
        run: python3 skills/asd-ste100/scripts/check_markdown_anchors.py

      - name: Run full technical-document lint
        if: steps.baseline.outputs.full_audit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.md' |
            grep -vE '^(novels/|drawings/|master/|skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))')
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if bash skills/asd-ste100/scripts/ste-lint-repository.sh "$file"; then
              :
            else
              echo "Lint failure: $file"
              failed=1
            fi
          done <<< "$files"
          exit "$failed"

      - name: Find Markdown files changed since the last successful run
        id: changed
        if: steps.baseline.outputs.full_audit == 'false'
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base_sha }}
        run: |
          set -euo pipefail
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.md' |
            grep -vE '^(novels/|drawings/|master/|skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/))' || true)
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run STE linter on changed Markdown files
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            bash skills/asd-ste100/scripts/ste-lint-repository.sh "$file"
          done <<< "$CHANGED_FILES"
