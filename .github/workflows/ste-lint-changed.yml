name: STE Lint Changed Documentation

on:
  workflow_call:
    inputs:
      coordinator_call:
        description: "True when invoked by the ADR-0008 exact-SHA coordinator."
        required: false
        type: boolean
        default: false
      source_sha:
        description: "Exact source commit to validate."
        required: true
        type: string
  push:
    branches:
      - gpt
    paths:
      - '**.md'
      - '!.takeout/reports/**'
      - '!workspace/tasks/**'
      - '!workspace/task-validation/**'
      - '!workspace/task_board.md'
      - '!workspace/discussion.md'
      - '!area/novel/**'
      - '!area/drawing/**'
      - '!master/**'
      - '!.agent/skills/romantic-storyteller-visual-artist/**'
      - '!.agent/skills/prompt-master/**'
      - '!.agent/skills/asd-ste100/**'

# Only newer pushes to the same branch supersede older push lint runs.
# The newer commit contains the cumulative branch state and rechecks the changes.
# Manual runs get unique groups and never cancel an automatic push validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && 'push' || github.run_id }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Find lint baseline and select execution mode
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.baseline.outputs.proceed }}
      base_sha: ${{ steps.baseline.outputs.base_sha }}
      full_audit: ${{ steps.baseline.outputs.full_audit }}
    steps:
      - name: Find the latest complete lint baseline
        id: baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COORDINATOR_CALL: ${{ inputs.coordinator_call }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          source_policy_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.agent/skills/the-worker/assets/task-validation/task-validation-policy.json?ref=$SOURCE_SHA" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
          current_policy_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.agent/skills/the-worker/assets/task-validation/task-validation-policy.json?ref=gpt" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
          policy_ready='
            .coordinator.activation_status == "enabled" and
            .recovery.schedule_activation_status == "verified" and
            .recovery.workflow_dispatch_activation_status == "verified"
          '
          coordinator_ready=false
          if [[ -n "$source_policy_json" && -n "$current_policy_json" ]] &&
             jq -e "$policy_ready" <<< "$source_policy_json" >/dev/null 2>&1 &&
             jq -e "$policy_ready" <<< "$current_policy_json" >/dev/null 2>&1; then
            coordinator_ready=true
          fi
          if [[ "$COORDINATOR_CALL" == "true" ]]; then
            base_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.parents[0].sha // empty')
            if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
              echo "full_audit=false" >> "$GITHUB_OUTPUT"
            else
              echo "full_audit=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$coordinator_ready" == "true" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Legacy direct-push lint is disabled only after coordinator and recovery dispatch gates are verified."
            exit 0
          fi
          index_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.takeout/reports/index.json?ref=$GITHUB_REF_NAME" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
          entry=$(jq -c '[.runs[]? | select(.family=="lint" and .scope=="on_changed" and (.status=="Passed" or .status=="Failed") and (.execution_mode=="incremental" or .execution_mode=="full-audit-fallback"))] | sort_by(.generated_at_utc) | reverse | .[0] // empty' <<< "$index_json" 2>/dev/null || true)
          history_path=$(jq -r '.history_path // empty' <<< "$entry" 2>/dev/null || true)
          if [[ -z "$history_path" || "$history_path" != history/* || "$history_path" == *..* || "$history_path" == /* ]]; then
            echo "::warning::No eligible indexed lint baseline. Run a full audit."
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          report_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.takeout/reports/$history_path/report.json?ref=$GITHUB_REF_NAME" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null || true)
          if [[ -z "$report_json" ]] || ! jq -e '.scope=="on_changed" and (.status=="Passed" or .status=="Failed") and (.commit_sha|type=="string" and test("^[0-9a-f]{40}$")) and (.checks|type=="array")' <<< "$report_json" >/dev/null; then
            echo "::warning::Indexed report is unavailable or invalid. Run a full audit."
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          baseline_sha=$(jq -r '.commit_sha' <<< "$report_json")
          compare_status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$baseline_sha...$GITHUB_SHA" --jq '.status' 2>/dev/null || true)
          if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
            echo "::warning::Baseline commit is not an ancestor. Run a full audit."
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base_sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "full_audit=false" >> "$GITHUB_OUTPUT"

  ste-lint:
    name: Lint changed Markdown files and publish detailed evidence
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1

      - name: Fetch only the successful baseline commit
        id: fetch_baseline
        if: needs.preflight.outputs.full_audit == 'false'
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" == "$GITHUB_SHA" ]]; then
            echo "full_audit=false" >> "$GITHUB_OUTPUT"
          elif git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "full_audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not fetch the baseline commit. Run a full audit."
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve indexed baseline report
        id: report_baseline
        if: needs.preflight.outputs.full_audit == 'false' && steps.fetch_baseline.outputs.full_audit != 'true' && inputs.coordinator_call != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          set -uo pipefail
          fallback() {
            echo "::warning::$1 Run a full audit instead."
            echo "full_audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          index_json=$(gh api "repos/$GITHUB_REPOSITORY/contents/.takeout/reports/index.json?ref=$GITHUB_REF_NAME" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null) || fallback "Could not retrieve the report index."
          history_path=$(jq -r --arg sha "$BASE_SHA" '[.runs[]? | select(.family=="lint" and .scope=="on_changed" and .commit_sha==$sha and (.status=="Passed" or .status=="Failed"))] | .[0].history_path // empty' <<< "$index_json" 2>/dev/null) || fallback "Could not resolve the indexed baseline path."
          if [[ -z "$history_path" || "$history_path" != history/* || "$history_path" == *..* || "$history_path" == /* ]]; then
            fallback "Could not safely resolve the baseline report path."
          fi
          report=$(gh api "repos/$GITHUB_REPOSITORY/contents/.takeout/reports/$history_path/report.json?ref=$GITHUB_REF_NAME" --jq '.content' 2>/dev/null | base64 --decode 2>/dev/null) || fallback "The indexed baseline report is unavailable."
          if ! jq -e '.scope=="on_changed" and (.status=="Passed" or .status=="Failed") and (.commit_sha|type=="string" and test("^[0-9a-f]{40}$")) and (.checks|type=="array")' <<< "$report" >/dev/null; then
            fallback "The indexed baseline report is invalid."
          fi
          printf '%s\n' "$report" > .lint-baseline-report.json
          echo "full_audit=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate lint and report tooling
        id: tooling
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .lint-report-records
          failed=0
          run_check() {
            name="$1"
            shift
            output=".lint-report-records/$name.log"
            status=0
            "$@" > "$output" 2>&1 || status=$?
            key="$name"_exit
            printf '%s=%s\n' "$key" "$status" >> "$GITHUB_OUTPUT"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          }
          run_check wrapper_syntax bash -n .agent/skills/asd-ste100/scripts/ste-lint-repository.sh
          run_check python_compile python3 -m py_compile \
            .agent/skills/the-worker/scripts/generate_lint_report.py \
            .agent/skills/asd-ste100/scripts/check_markdown_anchors.py
          run_check report_tests python3 .agent/skills/the-worker/scripts/test_generate_lint_report.py
          run_check anchor_tests python3 .agent/skills/asd-ste100/scripts/test_check_markdown_anchors.py
          run_check linter_selftest python3 .agent/skills/asd-ste100/scripts/ste-lint.py --selftest
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Check active Markdown file links and heading anchors
        id: anchors
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          FULL_AUDIT: ${{ needs.preflight.outputs.full_audit }}
          FETCH_FALLBACK: ${{ steps.fetch_baseline.outputs.full_audit }}
          REPORT_FALLBACK: ${{ steps.report_baseline.outputs.full_audit }}
        run: |
          set -uo pipefail
          status=0
          if [[ "$FULL_AUDIT" == "true" || "$FETCH_FALLBACK" == "true" || "$REPORT_FALLBACK" == "true" ]]; then
            python3 .agent/skills/asd-ste100/scripts/check_markdown_anchors.py \
              > .lint-report-records/anchor-check.log 2>&1 || status=$?
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.md' |
              grep -vE '^(\.takeout/reports/|workspace/tasks/|workspace/discussion[.]md$|area/novel/|area/drawing/|master/|\.agent/skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))' \
              > .lint-report-records/anchor-sources.txt || true
            python3 .agent/skills/asd-ste100/scripts/check_markdown_anchors.py \
              --sources-file .lint-report-records/anchor-sources.txt \
              > .lint-report-records/anchor-check.log 2>&1 || status=$?
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Run full technical-document lint
        id: full_audit
        if: needs.preflight.outputs.full_audit == 'true' || steps.fetch_baseline.outputs.full_audit == 'true' || steps.report_baseline.outputs.full_audit == 'true'
        shell: bash
        run: |
          set -uo pipefail
          git ls-files -- '*.md' |
            grep -vE '^(\.takeout/reports/|workspace/tasks/|workspace/discussion[.]md$|area/novel/|area/drawing/|master/|\.agent/skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))' \
            > .lint-report-records/evaluated-files.txt || true
          failed=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            key=$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)
            output=".lint-report-records/$key.json"
            raw="$output.raw"
            status=0
            bash .agent/skills/asd-ste100/scripts/ste-lint-repository.sh --json "$file" > "$raw" 2>&1 || status=$?
            if jq -e '.violations | type == "array"' "$raw" >/dev/null 2>&1; then
              jq --arg path "$file" --argjson exit_code "$status" \
                '. + {path:$path, exit_code:$exit_code}' "$raw" > "$output"
            else
              python3 - "$file" "$status" "$raw" "$output" <<'PY'
          import json, pathlib, sys
          path, exit_code, raw_path, output_path = sys.argv[1:]
          raw = pathlib.Path(raw_path).read_text(encoding="utf-8", errors="replace")
          payload = {
              "path": path,
              "exit_code": int(exit_code) if int(exit_code) else 2,
              "capture_error": raw,
              "violations": [],
          }
          pathlib.Path(output_path).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
              failed=1
            fi
            rm -f "$raw"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          done < .lint-report-records/evaluated-files.txt
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Find Markdown files changed since the last successful run
        id: changed
        if: needs.preflight.outputs.full_audit == 'false' && steps.fetch_baseline.outputs.full_audit != 'true' && steps.report_baseline.outputs.full_audit != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.md' |
            grep -vE '^(\.takeout/reports/|workspace/tasks/|workspace/discussion[.]md$|area/novel/|area/drawing/|master/|\.agent/skills/(romantic-storyteller-visual-artist/|prompt-master/|asd-ste100/examples/))' \
            > .lint-report-records/changed-files.txt || true
          {
            echo "files<<EOF"
            cat .lint-report-records/changed-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run STE linter on changed Markdown files
        id: changed_lint
        if: steps.changed.outputs.files != ''
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            key=$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)
            output=".lint-report-records/$key.json"
            raw="$output.raw"
            status=0
            bash .agent/skills/asd-ste100/scripts/ste-lint-repository.sh --json "$file" > "$raw" 2>&1 || status=$?
            if jq -e '.violations | type == "array"' "$raw" >/dev/null 2>&1; then
              jq --arg path "$file" --argjson exit_code "$status" \
                '. + {path:$path, exit_code:$exit_code}' "$raw" > "$output"
            else
              python3 - "$file" "$status" "$raw" "$output" <<'PY'
          import json, pathlib, sys
          path, exit_code, raw_path, output_path = sys.argv[1:]
          raw = pathlib.Path(raw_path).read_text(encoding="utf-8", errors="replace")
          payload = {
              "path": path,
              "exit_code": int(exit_code) if int(exit_code) else 2,
              "capture_error": raw,
              "violations": [],
          }
          pathlib.Path(output_path).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
              failed=1
            fi
            rm -f "$raw"
            if [[ "$status" -ne 0 ]]; then failed=1; fi
          done <<< "$CHANGED_FILES"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Generate and publish changed-document lint evidence
        if: ${{ !cancelled() && needs.preflight.outputs.proceed == 'true' && inputs.coordinator_call != true }}
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          FULL_AUDIT: ${{ needs.preflight.outputs.full_audit }}
          FETCH_FALLBACK: ${{ steps.fetch_baseline.outputs.full_audit }}
          REPORT_FALLBACK: ${{ steps.report_baseline.outputs.full_audit }}
          TOOLING_FAILED: ${{ steps.tooling.outputs.failed }}
          WRAPPER_EXIT: ${{ steps.tooling.outputs.wrapper_syntax_exit }}
          PYTHON_EXIT: ${{ steps.tooling.outputs.python_compile_exit }}
          REPORT_TEST_EXIT: ${{ steps.tooling.outputs.report_tests_exit }}
          ANCHOR_TEST_EXIT: ${{ steps.tooling.outputs.anchor_tests_exit }}
          SELFTEST_EXIT: ${{ steps.tooling.outputs.linter_selftest_exit }}
          ANCHOR_OUTCOME: ${{ steps.anchors.outcome }}
          ANCHOR_EXIT: ${{ steps.anchors.outputs.exit_code }}
          FULL_FAILED: ${{ steps.full_audit.outputs.failed }}
          CHANGED_FAILED: ${{ steps.changed_lint.outputs.failed }}
        run: |
          set -euo pipefail
          mode="incremental"
          baseline="$BASE_SHA"
          if [[ "$FULL_AUDIT" == "true" || "$FETCH_FALLBACK" == "true" || "$REPORT_FALLBACK" == "true" ]]; then
            mode="full-audit-fallback"
            baseline=""
          fi
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(".lint-report-records")
          checks = []
          for key, label in (
              ("WRAPPER_EXIT", "Wrapper shell syntax"),
              ("PYTHON_EXIT", "Python report tooling compilation"),
              ("REPORT_TEST_EXIT", "Lint report regression tests"),
              ("ANCHOR_TEST_EXIT", "Markdown anchor regression tests"),
              ("SELFTEST_EXIT", "STE linter self-test"),
          ):
              raw = os.environ.get(key, "")
              exit_code = int(raw) if raw.isdigit() else 2
              log_names = {
                  "WRAPPER_EXIT": "wrapper_syntax.log",
                  "PYTHON_EXIT": "python_compile.log",
                  "REPORT_TEST_EXIT": "report_tests.log",
                  "ANCHOR_TEST_EXIT": "anchor_tests.log",
                  "SELFTEST_EXIT": "linter_selftest.log",
              }
              log = root / log_names[key]
              checks.append({
                  "name": label,
                  "status": "Passed" if exit_code == 0 else "Failed",
                  "exit_code": exit_code,
                  "output": log.read_text(encoding="utf-8", errors="replace") if log.exists() else "No output captured.",
              })
          anchor_outcome = os.environ.get("ANCHOR_OUTCOME", "skipped")
          anchor_raw = os.environ.get("ANCHOR_EXIT", "")
          if anchor_outcome == "skipped":
              checks.append({
                  "name": "Markdown links and heading anchors",
                  "status": "Skipped", "exit_code": None,
                  "output": "Not required for this incremental run.",
              })
          else:
              exit_code = int(anchor_raw) if anchor_raw.isdigit() else 2
              path = root / "anchor-check.log"
              checks.append({
                  "name": "Markdown links and heading anchors",
                  "status": "Passed" if exit_code == 0 else "Failed",
                  "exit_code": exit_code,
                  "output": path.read_text(encoding="utf-8", errors="replace") if path.exists() else "No output captured.",
              })
          pathlib.Path(".lint-report-checks.json").write_text(
              json.dumps(checks, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          status="Passed"
          if [[ "$TOOLING_FAILED" == "1" || "$FULL_FAILED" == "1" || "$CHANGED_FAILED" == "1" ]]; then status="Failed"; fi
          if [[ "$ANCHOR_OUTCOME" != "skipped" && "$ANCHOR_EXIT" != "0" ]]; then status="Failed"; fi
          task_id=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            task_id="$(git show -s --format=%B "$GITHUB_SHA" | sed -nE 's/^Task-ID:[[:space:]]*([0-9]{8}-[0-9]{6}(-[0-9]{2})*)[[:space:]]*$/\1/p' | paste -sd, -)"
          fi
          history_dir=".takeout/reports/history/$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          python3 .agent/skills/the-worker/scripts/generate_lint_report.py \
            --scope on_changed --records-dir .lint-report-records \
            --output-dir "$history_dir" \
            --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --branch "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME" \
            --mode "$mode" --baseline "$baseline" --status "$status" \
            --checks-file .lint-report-checks.json \
            --previous-report  .lint-baseline-report.json \
            --linter-source-sha "$(git rev-parse HEAD)" --task-id "$task_id"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .takeout/reports
          if ! git diff --cached --quiet; then
            git commit -m "Publish changed-document lint evidence"
            published=0
            for attempt in 1 2 3 4 5; do
              git fetch origin gpt
              if ! git rebase origin/gpt; then
                git rebase --abort || true
                echo "::error::Could not rebase lint evidence onto gpt."
                exit 1
              fi
              if git push origin "HEAD:gpt"; then
                echo "Changed-document lint evidence published."
                published=1
                break
              fi
              git fetch origin gpt
              if git merge-base --is-ancestor origin/gpt HEAD; then
                echo "::error::Push failed while origin/gpt was unchanged."
                exit 1
              fi
            done
            if [[ "$published" != "1" ]]; then
              echo "::error::Could not publish changed-document lint evidence after five attempts."
              exit 1
            fi
          fi

      - name: Preserve lint failure as workflow conclusion
        if: always() && needs.preflight.outputs.proceed == 'true'
        shell: bash
        env:
          TOOLING_FAILED: ${{ steps.tooling.outputs.failed }}
          FULL_FAILED: ${{ steps.full_audit.outputs.failed }}
          CHANGED_FAILED: ${{ steps.changed_lint.outputs.failed }}
          ANCHOR_OUTCOME: ${{ steps.anchors.outcome }}
          ANCHOR_EXIT: ${{ steps.anchors.outputs.exit_code }}
        run: |
          if [[ "$TOOLING_FAILED" == "1" || "$FULL_FAILED" == "1" || "$CHANGED_FAILED" == "1" || ( "$ANCHOR_OUTCOME" != "skipped" && "$ANCHOR_EXIT" != "0" ) ]]; then
            echo "::error::Changed-document lint failed. See  .takeout/reports/history/lint/on_changed/."
            exit 1
          fi

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() && inputs.coordinator_call != true && needs.preflight.outputs.proceed == 'true' }}
    needs: [preflight, ste-lint]
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./.takeout/reports/gh_ac_reports/actions/capture
        with:
          run_id: ${{ github.run_id }}
