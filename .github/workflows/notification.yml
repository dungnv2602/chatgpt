name: Send Email on Notification Tag

on:
  push:
    tags:
      - 'notification-*'

permissions: {}

jobs:
  send-email:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Send notification email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SERVER_ADDRESS || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SERVER_PORT || 465 }}
          username: ${{ secrets.GMAIL_ID }}
          password: ${{ secrets.GMAIL_PWD }}
          subject: "[AI][Maya][${{ github.ref_name }}]"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            A new notification tag was pushed to the repository.
            Repository: ${{ github.repository }}
            Tag: ${{ github.ref_name }}
            Pushed by: ${{ github.actor }}
            Commit SHA: ${{ github.sha }}
          convert_markdown: true

  diagnostics:
    name: Capture GH Actions diagnostics
    if: ${{ always() }}
    needs: [send-email]
    concurrency:
      group: gh-ac-report-writer-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt for diagnostic reporting
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Capture workflow diagnostics
        uses: ./.takeout/.takeout/reports/gh_ac_.takeout/reports/actions/capture
