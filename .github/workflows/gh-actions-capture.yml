name: Capture GitHub Actions Diagnostics

on:
  workflow_run:
    workflows:
      - Scheduled Archive Individual Retention
      - Process Image Takeout and Create WebP Derivatives
      - STE Lint Changed Documentation
      - STE Lint Full Technical Documentation
      - Validate Document Standards
      - Send Email on Notification Tag
    types:
      - completed

concurrency:
  group: gh-ac-capture-${{ github.repository }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions: {}

jobs:
  capture:
    name: Capture completed workflow diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: write
    steps:
      - name: Check out gpt
        uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile and test cancellation-safe diagnostic reporting
        run: |
          python3 -m py_compile .agent/skills/the-worker/scripts/actions-report.py .agent/skills/the-worker/scripts/ledger.py
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_actions-report.py' \
            -v
          python3 -m unittest discover \
            -s .agent/skills/the-worker/scripts \
            -p 'test_ledger.py' \
            -v

      - name: Capture source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .agent/skills/the-worker/scripts/actions-report.py --mode current --repo "$GITHUB_REPOSITORY" --run-id "${{ github.event.workflow_run.id }}"

      - name: Update central CI issue ledger
        if: always()
        run: python3 .agent/skills/the-worker/scripts/ledger.py --mode ingest

      - name: Publish diagnostic evidence and Worker tasks
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A --  .takeout/reports/history/actions/  .takeout/reports/ workspace/tasks/ workspace/task_board.md
          if git diff --cached --quiet; then
            echo "No new diagnostic evidence to publish."
            exit 0
          fi
          git commit -m "Publish GitHub Actions diagnostics and CI issue ledger"
          for attempt in 1 2 3 4 5; do
            git fetch origin gpt
            if ! git rebase origin/gpt; then
              git rebase --abort || true
              echo "::error::Could not rebase diagnostic evidence onto gpt."
              exit 1
            fi
            if git push origin HEAD:refs/heads/gpt; then
              echo "Diagnostic evidence published."
              exit 0
            fi
            git fetch origin gpt
            if git merge-base --is-ancestor origin/gpt HEAD; then
              echo "::error::Push failed while origin/gpt was unchanged."
              exit 1
            fi
          done
          echo "::error::Could not publish diagnostic evidence after five attempts."
          exit 1

